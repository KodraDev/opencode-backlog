name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check whether this version is new
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const { name, version, private: isPrivate } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (isPrivate) throw new Error('Refusing to publish a private package')
          if (name !== 'kodradev-opencode-backlog') throw new Error('Unexpected package name')
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`
          const response = await fetch(url, { signal: AbortSignal.timeout(30_000) })
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Registry lookup failed: HTTP ${response.status}`)
          }
          const publish = response.status === 404
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\n`)
          console.log(publish ? `Publishing ${name}@${version}` : `${name}@${version} already exists; skipping`)
          NODE

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck production sources
        if: steps.release.outputs.publish == 'true'
        run: pnpm run typecheck:src

      - name: Build package
        if: steps.release.outputs.publish == 'true'
        run: pnpm run build

      - name: Inspect package contents
        if: steps.release.outputs.publish == 'true'
        run: pnpm publish --dry-run --no-git-checks --ignore-scripts --access public --registry https://registry.npmjs.org/

      - name: Publish with npm Trusted Publishing
        if: steps.release.outputs.publish == 'true'
        run: pnpm publish --no-git-checks --access public --ignore-scripts --registry https://registry.npmjs.org/
